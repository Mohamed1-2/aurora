apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: prod

images:
  - name: aurora.azurecr.io/telemetry-simulator
    newTag: latest
  - name: aurora.azurecr.io/llm-gateway
    newTag: latest
  - name: aurora.azurecr.io/rag-service
    newTag: latest
  - name: aurora.azurecr.io/assistant-api
    newTag: latest
  - name: aurora.azurecr.io/monitoring
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: assistant-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: Deployment
      name: llm-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: rag-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3