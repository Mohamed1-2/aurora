apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aurora-ingress
  namespace: aurora
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dashboard.aurora.example.com
      secretName: aurora-tls
  rules:
    - host: dashboard.aurora.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assistant-api
                port:
                  number: 8100