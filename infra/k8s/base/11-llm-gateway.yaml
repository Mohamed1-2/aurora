apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: aurora
  labels: &labels
    app.kubernetes.io/part-of: aurora
    app.kubernetes.io/component: llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: llm-gateway
          image: aurora.azurecr.io/llm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8102}
          envFrom:
            - configMapRef: {name: aurora-env}
            - secretRef: {name: aurora-secrets}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: aurora
spec:
  selector:
    app.kubernetes.io/part-of: aurora
    app.kubernetes.io/component: llm-gateway
  ports:
    - {port: 8102, targetPort: http}