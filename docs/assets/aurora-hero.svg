<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">AURORA — In-vehicle AI assistant</title><desc id="desc">Vehicle telemetry, retrieved knowledge, and policy-aware responses. Python microservices with GitHub Actions and Azure AKS.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#58ded4" stroke-width="1.5"/></marker></defs><rect width="1200" height="390" rx="24" fill="#0b1220"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="50" font-size="14" font-weight="700" fill="#58ded4">ENGINEERING SHOWCASE  /  VEHICLE INTELLIGENCE</text><text x="46" y="139" font-size="82" font-weight="700" fill="#edf5ff">AURORA</text><text x="50" y="189" font-size="29" font-weight="400" fill="#edf5ff">An assistant that starts with the vehicle.</text><text x="50" y="230" font-size="19" font-weight="400" fill="#a6b8ce">Live signals. Retrieved knowledge. Policy-aware answers.</text><rect x="50" y="278" width="180" height="36" rx="18" fill="#121e30" stroke="#2b4059"/><text x="64" y="301" font-size="13" font-weight="700" fill="#58ded4">PYTHON + FASTAPI</text><rect x="244" y="278" width="160" height="36" rx="18" fill="#121e30" stroke="#2b4059"/><text x="258" y="301" font-size="13" font-weight="700" fill="#70adff">RAG + TELEMETRY</text><rect x="418" y="278" width="170" height="36" rx="18" fill="#121e30" stroke="#2b4059"/><text x="432" y="301" font-size="13" font-weight="700" fill="#f5c777">GITHUB → AZURE</text><text x="50" y="355" font-size="14" font-weight="400" fill="#a6b8ce">Simulation-first demo • Mock AI by default • Optional model providers</text><g transform="translate(815 185)"><circle r="127" fill="none" stroke="#20344d" stroke-width="18"/><path d="M-110 64 A127 127 0 1 1 112 59" fill="none" stroke="#58ded4" stroke-width="5"/><path d="M-84 28 L-65 -13 L-40 -26 L44 -26 L69 -8 L86 28 Z" fill="#1b3548" stroke="#70adff" stroke-width="3"/><path d="M-43 -23 L-27 -48 L28 -48 L49 -23" fill="none" stroke="#70adff" stroke-width="3"/><circle cx="-49" cy="30" r="16" fill="#0b1220" stroke="#58ded4" stroke-width="3"/><circle cx="49" cy="30" r="16" fill="#0b1220" stroke="#58ded4" stroke-width="3"/></g><text x="1020" y="130" font-size="13" font-weight="700" fill="#58ded4">SIGNALS</text><text x="1020" y="157" font-size="15" font-weight="400" fill="#a6b8ce">SOC • range</text><text x="1020" y="185" font-size="15" font-weight="400" fill="#a6b8ce">DTC • energy</text><text x="1020" y="245" font-size="13" font-weight="700" fill="#70adff">CONTEXT</text><text x="1020" y="272" font-size="15" font-weight="400" fill="#a6b8ce">Manuals</text><text x="1020" y="300" font-size="15" font-weight="400" fill="#a6b8ce">Citations</text></g></svg>