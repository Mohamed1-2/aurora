<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">AURORA GitHub Actions to Azure deployment</title><desc id="desc">Push to main runs pytest, builds and checks four Docker images, authenticates through OIDC and publishes to ACR. The workflow updates AKS, which pulls the images. An Azure load balancer exposes the assistant dashboard over HTTP.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#58ded4" stroke-width="1.5"/></marker></defs><rect width="1200" height="780" rx="24" fill="#0b1220"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="47" font-size="15" font-weight="700" fill="#58ded4">02 / DELIVERY ARCHITECTURE</text><text x="40" y="87" font-size="30" font-weight="700" fill="#edf5ff">From a Git commit to an Azure deployment</text><rect x="40" y="135" width="320" height="130" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="58" y="153" width="32" height="32" rx="9" fill="#58ded4"/><text x="65" y="175" font-size="15" font-weight="700" fill="#0b1220">01</text><text x="102" y="176" font-size="20" font-weight="700" fill="#edf5ff">GitHub repository</text><text x="60" y="213" font-size="15" font-weight="400" fill="#a6b8ce">Push a commit to main</text><text x="60" y="236" font-size="15" font-weight="400" fill="#a6b8ce">Source code + workflow YAML</text><rect x="440" y="135" width="320" height="130" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="458" y="153" width="32" height="32" rx="9" fill="#58ded4"/><text x="465" y="175" font-size="15" font-weight="700" fill="#0b1220">02</text><text x="502" y="176" font-size="20" font-weight="700" fill="#edf5ff">GitHub Actions</text><text x="460" y="213" font-size="15" font-weight="400" fill="#a6b8ce">Run pytest → build Docker images</text><text x="460" y="236" font-size="15" font-weight="400" fill="#a6b8ce">Import-check all four containers</text><rect x="840" y="135" width="320" height="130" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="858" y="153" width="32" height="32" rx="9" fill="#58ded4"/><text x="865" y="175" font-size="15" font-weight="700" fill="#0b1220">03</text><text x="902" y="176" font-size="20" font-weight="700" fill="#edf5ff">Azure registry</text><text x="860" y="213" font-size="15" font-weight="400" fill="#a6b8ce">Private container image storage</text><text x="860" y="236" font-size="15" font-weight="400" fill="#a6b8ce">Unique tags for each workflow run</text><path d="M360 200 H440" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 200 H840" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="314" font-size="13" font-weight="700" fill="#f5c777">AUTHENTICATION</text><text x="212" y="314" font-size="17" font-weight="400" fill="#a6b8ce">OIDC token → Azure identity</text><rect x="40" y="373" width="320" height="135" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="58" y="391" width="32" height="32" rx="9" fill="#58ded4"/><text x="65" y="413" font-size="15" font-weight="700" fill="#0b1220">06</text><text x="102" y="414" font-size="20" font-weight="700" fill="#edf5ff">Browser</text><text x="60" y="451" font-size="15" font-weight="400" fill="#a6b8ce">Open the assigned public IP</text><text x="60" y="474" font-size="15" font-weight="400" fill="#a6b8ce">HTTP learning demo</text><rect x="440" y="373" width="320" height="135" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="458" y="391" width="32" height="32" rx="9" fill="#58ded4"/><text x="465" y="413" font-size="15" font-weight="700" fill="#0b1220">05</text><text x="502" y="414" font-size="20" font-weight="700" fill="#edf5ff">Azure load balancer</text><text x="460" y="451" font-size="15" font-weight="400" fill="#a6b8ce">Public port 80</text><text x="460" y="474" font-size="15" font-weight="400" fill="#a6b8ce">Forwards to assistant port 8100</text><rect x="840" y="373" width="320" height="135" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="858" y="391" width="32" height="32" rx="9" fill="#58ded4"/><text x="865" y="413" font-size="15" font-weight="700" fill="#0b1220">04</text><text x="902" y="414" font-size="20" font-weight="700" fill="#edf5ff">AKS · aurora</text><text x="860" y="451" font-size="15" font-weight="400" fill="#a6b8ce">Pull images and start pods</text><text x="860" y="474" font-size="15" font-weight="400" fill="#a6b8ce">Namespace: aurora</text><path d="M1000 265 V373" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)"/><text x="1015" y="342" font-size="13" font-weight="400" fill="#58ded4">image pull</text><path d="M840 440 H760" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 440 H360" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 265 V350 H880 V373" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="617" y="340" font-size="13" font-weight="400" fill="#58ded4">apply deployments</text><rect x="40" y="551" width="1120" height="161" rx="16" fill="#121e30" stroke="#2b4059"/><text x="64" y="586" font-size="14" font-weight="700" fill="#58ded4">WHAT THE CURRENT WORKFLOW CHECKS</text><text x="64" y="619" font-size="20" font-weight="400" fill="#edf5ff">Tests pass → images import → deployments roll out → assistant health endpoint responds</text><text x="64" y="653" font-size="16" font-weight="400" fill="#a6b8ce">Four services • One replica each • Mock AI • Recreate updates • Public HTTP service</text><text x="64" y="684" font-size="15" font-weight="400" fill="#f5c777">Separate evaluation tooling exists; model-quality scoring is not a gate in this workflow.</text><text x="42" y="755" font-size="14" font-weight="400" fill="#a6b8ce">Configured deployment design; this diagram does not claim that a live release has completed successfully.</text></g></svg>