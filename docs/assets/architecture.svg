<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">AURORA application architecture</title><desc id="desc">A browser sends questions to the assistant API. The assistant consumes simulator telemetry, retrieves knowledge through the RAG service, and calls the LLM gateway. Mock responses are the default; external providers and monitoring are optional.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#58ded4" stroke-width="1.5"/></marker></defs><rect width="1200" height="860" rx="24" fill="#0b1220"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="47" font-size="15" font-weight="700" fill="#58ded4">01 / APPLICATION ARCHITECTURE</text><text x="40" y="87" font-size="28" font-weight="700" fill="#edf5ff">How a driver question becomes a grounded answer</text><rect x="40" y="125" width="290" height="124" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="58" y="143" width="32" height="32" rx="9" fill="#58ded4"/><text x="65" y="165" font-size="15" font-weight="700" fill="#0b1220">01</text><text x="102" y="166" font-size="20" font-weight="700" fill="#edf5ff">Browser dashboard</text><text x="60" y="203" font-size="15" font-weight="400" fill="#a6b8ce">Question, dashboard &amp; controls</text><text x="60" y="226" font-size="15" font-weight="400" fill="#a6b8ce">Single public application entry</text><rect x="410" y="125" width="355" height="124" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="428" y="143" width="32" height="32" rx="9" fill="#58ded4"/><text x="435" y="165" font-size="15" font-weight="700" fill="#0b1220">02</text><text x="472" y="166" font-size="20" font-weight="700" fill="#edf5ff">Assistant API · 8100</text><text x="430" y="203" font-size="15" font-weight="400" fill="#a6b8ce">Intent + policy + context assembly</text><text x="430" y="226" font-size="15" font-weight="400" fill="#a6b8ce">Hosts the web dashboard</text><path d="M330 188 H410" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)"/><text x="345" y="173" font-size="12" font-weight="400" fill="#58ded4">HTTP</text><rect x="30" y="303" width="1140" height="342" rx="20" fill="none" stroke="#31465e" stroke-dasharray="7 6"/><text x="50" y="355" font-size="14" font-weight="400" fill="#a6b8ce">SERVICES</text><rect x="50" y="375" width="330" height="172" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="68" y="393" width="32" height="32" rx="9" fill="#58ded4"/><text x="75" y="415" font-size="15" font-weight="700" fill="#0b1220">03</text><text x="112" y="416" font-size="20" font-weight="700" fill="#edf5ff">Telemetry · 8101</text><text x="70" y="453" font-size="15" font-weight="400" fill="#a6b8ce">Physics-based EV simulation</text><text x="70" y="476" font-size="15" font-weight="400" fill="#a6b8ce">Charge, range, temperatures, DTCs</text><text x="70" y="499" font-size="15" font-weight="400" fill="#a6b8ce">WebSocket stream + HTTP</text><rect x="435" y="375" width="330" height="172" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="453" y="393" width="32" height="32" rx="9" fill="#58ded4"/><text x="460" y="415" font-size="15" font-weight="700" fill="#0b1220">04</text><text x="497" y="416" font-size="20" font-weight="700" fill="#edf5ff">RAG service · 8103</text><text x="455" y="453" font-size="15" font-weight="400" fill="#a6b8ce">Finds relevant document passages</text><text x="455" y="476" font-size="15" font-weight="400" fill="#a6b8ce">BM25 retrieval + source metadata</text><text x="455" y="499" font-size="15" font-weight="400" fill="#a6b8ce">Committed knowledge pack</text><rect x="820" y="375" width="330" height="172" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="838" y="393" width="32" height="32" rx="9" fill="#58ded4"/><text x="845" y="415" font-size="15" font-weight="700" fill="#0b1220">05</text><text x="882" y="416" font-size="20" font-weight="700" fill="#edf5ff">LLM gateway · 8102</text><text x="840" y="453" font-size="15" font-weight="400" fill="#a6b8ce">Routes completion requests</text><text x="840" y="476" font-size="15" font-weight="400" fill="#a6b8ce">Mock provider enabled by default</text><text x="840" y="499" font-size="15" font-weight="400" fill="#a6b8ce">Provider failover + cache</text><path d="M215 375 V280 H480 V249" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)"/><text x="230" y="274" font-size="13" font-weight="400" fill="#58ded4">live signals</text><path d="M590 249 V375" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)"/><text x="604" y="292" font-size="13" font-weight="400" fill="#58ded4">retrieve passages</text><path d="M710 249 V280 H985 V375" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)"/><text x="847" y="274" font-size="13" font-weight="400" fill="#58ded4">grounded prompt</text><text x="72" y="588" font-size="18" font-weight="400" fill="#edf5ff">The assistant combines evidence, calls the provider, and returns an answer with available citations.</text><text x="72" y="617" font-size="15" font-weight="400" fill="#a6b8ce">Restricted and prohibited requests take a deterministic policy path before the LLM call.</text><rect x="50" y="691" width="515" height="117" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="68" y="709" width="32" height="32" rx="9" fill="#70adff"/><text x="75" y="731" font-size="15" font-weight="700" fill="#0b1220">+</text><text x="112" y="732" font-size="20" font-weight="700" fill="#edf5ff">Optional model providers</text><text x="70" y="769" font-size="15" font-weight="400" fill="#a6b8ce">Azure OpenAI / OpenAI / local PEFT adapters</text><rect x="610" y="691" width="540" height="117" rx="14" fill="#121e30" stroke="#2b4059"/><rect x="628" y="709" width="32" height="32" rx="9" fill="#f5c777"/><text x="635" y="731" font-size="15" font-weight="700" fill="#0b1220">+</text><text x="672" y="732" font-size="20" font-weight="700" fill="#edf5ff">Evaluation &amp; monitoring</text><text x="630" y="769" font-size="15" font-weight="400" fill="#a6b8ce">Replay scoring, retrieval checks, drift metrics, MLflow</text><path d="M985 547 V665 H310 V691" fill="none" stroke="#58ded4" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="42" y="840" font-size="13" font-weight="400" fill="#a6b8ce">Solid: core request/data paths   ·   Dashed: optional provider extension   ·   Ports: internal service listeners</text></g></svg>