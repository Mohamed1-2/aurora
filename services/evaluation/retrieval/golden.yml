# AURORA retrieval golden dataset — judged by manual intent against the
# real Born/ID corpus. A case's `expected` items are the sections a well-
# grounded assistant should cite; the harness scores rank quality.
#
# grade: primary (2, must-surface) or secondary (1, acceptable bonus).
# section_like: substring matched against the retrieved section label.
# page_label: printed page oracle when the manual pins one (page-anchor test).
#
# Corpus scope note: expected doc_ids refer to the *derived* corpus built by
# scripts/rag_build_corpus.py (manuals stay outside the repo).

cases:

  - id: low-tyre-pressure
    query: "The tyre pressure warning light came on, what should I do?"
    expected:
      - doc_id: cupra-born-03-26-owners-manual
        section_like: "Wheels and tyres"
        grade: primary

  - id: fast-charge-dc
    query: "How do I fast charge the Born with DC, up to 80 percent?"
    expected:
      - doc_id: cupra-born-03-26-owners-manual
        section_like: "High-voltage battery"
        page_label: "77"
        grade: primary
      - doc_id: cupra-born-charging-appendix
        grade: primary

  - id: cold-range-loss
    query: "Does cold weather reduce the driving range?"
    notes: "Manual is silent on cold-weather range degradation; the DOE science record is the honest primary answer."
    expected:
      - doc_id: doe-cold-weather-bev
        grade: primary
      - doc_id: cupra-born-03-26-owners-manual
        section_like: "Range"
        grade: secondary

  - id: charging-cable-protection
    query: "Which protection device protects the charging cable and socket?"
    expected:
      - doc_id: cupra-born-03-26-owners-manual
        section_like: "High-voltage battery"
        grade: primary

  - id: puncture-wheel-change
    query: "I have a puncture, how do I change the wheel?"
    expected:
      - doc_id: cupra-born-03-26-owners-manual
        section_like: "Wheels and tyres"
        page_label: "335"
        grade: primary

  - id: towing-vehicle
    query: "How can I tow my Born using another vehicle?"
    expected:
