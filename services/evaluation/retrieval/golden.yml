        section_like: "Safety"
        grade: primary

  - id: washer-fluid-topup
    query: "How do I top up the windscreen washer fluid?"
    expected:
      - doc_id: cupra-born-03-26-owners-manual
        section_like: "Checking and refilling levels"
        page_label: "321"
        grade: primary

  - id: cabin-preheating
    query: "How do I preheat or cool the cabin before I leave?"
    expected:
      - doc_id: cupra-born-03-26-owners-manual
        section_like: "Air conditioning"
        grade: primary
      - doc_id: doe-cold-weather-bev
        grade: secondary
    primary_lower_tier: true

  - id: care-mode-charge-limit
    query: "What is battery Care Mode and how do I limit the charge level?"
    expected:
      - doc_id: cupra-born-charging-appendix
        section_like: "High-voltage battery"
        grade: primary
      - doc_id: id-vehicles-service-description-software-3
        section_like: "Battery Care Mode"
        grade: secondary
    primary_lower_tier: true

  - id: e-charge-socket-unlock
